[package]
name = "vpm-sys"
version = "0.0.1"
edition = "2021"
build = "build.rs"

[package.metadata.system-deps]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
all-features = true

[lib]
name = "vpm_sys"

[dependencies]
libc = "0.2"

[dependencies.gio]
package = "gio-sys"
version = "0.19.8"

[dependencies.glib]
package = "glib-sys"
version = "0.19.8"

[dependencies.gobject]
package = "gobject-sys"
version = "0.19.8"

[dependencies.gtk]
package = "gtk4-sys"
version = "0.8.2"

[dependencies.gdk]
package = "gdk4-sys"
version = "0.8.2"

[build-dependencies]
system-deps = "6.2"
cc = "1.1"
pkg-config = "0.3"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
